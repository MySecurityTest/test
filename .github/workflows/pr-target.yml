name: PR Target Demo

on: [pull_request_target]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # BYPASS TEST 1: older checkout version (pre-guard)
      - name: Checkout PR via v2
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Run PR build script
        run: |
          ls -la
          if [ -f ./build.sh ]; then
            chmod +x ./build.sh
            ./build.sh
          else
            echo "no build script found"
            echo "secret check: ${#TEST_SECRET} chars"
          fi
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
