name: PR Target Demo

on: [pull_request_target]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # VULNERABLE: checks out the PR head code and runs it in base repo context
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      # This step runs a script FROM THE PR with access to base repo secrets
      - name: Run PR build script
        run: |
          if [ -f ./build.sh ]; then
            chmod +x ./build.sh
            ./build.sh
          else
            echo "no build script, running default"
            echo "secret length: ${#TEST_SECRET} chars"
          fi
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
