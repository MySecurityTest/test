name: GH Token Scope Test

on: [workflow_dispatch]

permissions: write-all

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump All Context
        run: |
          echo "===== GITHUB CONTEXT ====="
          echo "actor: ${{ github.actor }}"
          echo "repository: ${{ github.repository }}"
          echo "repository_owner: ${{ github.repository_owner }}"
          echo "token available: ${{ github.token != '' }}"
          echo ""
          echo "===== API: WHO AM I? ====="
          curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/user || echo "CURL FAILED: $?"
          echo ""
          echo "===== API: ORG ACCESS ====="
          curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/members?per_page=5" || echo "ORG MEMBERS FAILED: $?"
          echo ""
          echo "===== API: ORG REPOS ====="
          curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/repos?per_page=5" || echo "ORG REPOS FAILED: $?"
          echo ""
          echo "===== API: RATE LIMIT ====="
          curl -sf https://api.github.com/rate_limit || echo "RATE LIMIT FAILED: $?"
